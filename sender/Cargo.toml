[workspace]
resolver = "2"
members = [
  "crates/rtm-protocol",
  "crates/rtm-collect",
  "crates/rtm-net",
  "crates/rtm-config",
  "crates/rtm-sender",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/dan2304k/remote_tskmgr"
rust-version = "1.85"  # headless; the gui feature needs 1.95+ (eframe 0.37)

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.40"
toml = "0.9"
directories = "6"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
if-addrs = "0.14"
notify = "8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
hostname = "0.4"
ctrlc = { version = "3", features = ["termination"] }
socket2 = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
