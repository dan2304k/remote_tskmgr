name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  sender:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: rtm-sender-linux-x86_64
            bin: rtm-sender
          - os: windows-2022
            artifact: rtm-sender-windows-x86_64.exe
            bin: rtm-sender.exe
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: sender } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev
      - run: cargo build --release -p rtm-sender --features gui
      - run: cp target/release/${{ matrix.bin }} ../${{ matrix.artifact }}
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
  viewer:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: viewer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../rtm-viewer.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: rtm-viewer.apk
