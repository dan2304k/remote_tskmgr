name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  sender:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: sender, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev
      # Linux: a headless binary (no GTK needed, for servers) and a tray/GUI binary.
      - if: runner.os == 'Linux'
        run: |
          cargo build --release -p rtm-sender
          cp target/release/rtm-sender ../rtm-sender-linux-x86_64
          cargo build --release -p rtm-sender --features gui
          cp target/release/rtm-sender ../rtm-sender-gui-linux-x86_64
          echo "ASSETS<<EOF" >> "$GITHUB_ENV"
          echo "rtm-sender-linux-x86_64" >> "$GITHUB_ENV"
          echo "rtm-sender-gui-linux-x86_64" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      # Windows: the GUI build (needs no extra libraries), bare and as a zip with the installer.
      - if: runner.os == 'Windows'
        run: |
          cargo build --release -p rtm-sender --features gui
          cp target/release/rtm-sender.exe ../rtm-sender-windows-x86_64.exe
          mkdir -p ../zip/rtm-sender
          cp target/release/rtm-sender.exe ../packaging/windows/install.bat ../packaging/windows/uninstall.bat ../LICENSE ../zip/rtm-sender/
          cp ../packaging/README.md ../zip/rtm-sender/INSTALL.md
          (cd ../zip && 7z a -tzip ../rtm-sender-windows-x86_64.zip rtm-sender)
          echo "ASSETS<<EOF" >> "$GITHUB_ENV"
          echo "rtm-sender-windows-x86_64.exe" >> "$GITHUB_ENV"
          echo "rtm-sender-windows-x86_64.zip" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSETS }}
  viewer:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: viewer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../rtm-viewer.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: rtm-viewer.apk
